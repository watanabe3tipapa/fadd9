  <header class="page-head">

      <nav class="crumbs mono" aria-label="パンくず">
        <a href="../index.html">HOME</a> / <span>WORKS</span>
      </nav>
      <h1 class="page-title">Works<span class="section__sub">道具の地図</span></h1>
      <p class="page-lead">ツール・実験・ノートを横断して辿れるアーカイブです。検索とタグで目的のものへ最短で。</p>

  <main id="main">
    <section class="section section--flush-top">
      <div class="container">
        <div class="filters" role="group" aria-label="絞り込み">
          <div class="filters__types">
            <button type="button" class="filter-btn mono is-on" data-type="all" aria-pressed="true">ALL</button>
            <button type="button" class="filter-btn mono" data-type="tool" aria-pressed="false">TOOL · ツール</button>

          <div class="filters__search">
            <label class="visually-hidden" for="works-search">道具を検索</label>
            <input type="search" id="works-search" placeholder="検索… (例: markdown, ollama)" autocomplete="off">
          </div>
        </div>

        <div class="filters__foot mono">
          <p><span id="filtered-count">— / —</span> 件</p>
          <div class="tagbar" id="tag-bar" aria-label="タグで絞り込み"></div>
        </div>

        <noscript>
          <p class="works-error">JavaScript を有効にすると一覧・絞り込みが使えます。すべての道具は <a class="textlink" href="https://github.com/watanabe3tipapa/">GitHub</a> でも公開しています。</p>

        <div class="grid grid--3 works-grid" id="works-grid" aria-live="polite">
          <p class="works-error">読み込み中…</p>
        </div>
